[package]
name = "noted"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[lib]
name = "noted_cli"

[[bin]]
name = "noted"
path = "src/main.rs"

[dependencies]
noted-auth = { workspace = true }
noted-client = { workspace = true, features = ["desktop"] }
noted-core = { workspace = true }
noted-picker = { workspace = true }
noted-server = { workspace = true }
anstyle = "1"
chrono = { workspace = true }
clap = { workspace = true }
crossterm = "0.29"
etcetera = "0.11"
notify = "8"
dotenvy = "0.15"
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = "1"
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync"] }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "8"
