[package]
name = "noted-server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
noted-auth = { workspace = true }
noted-core = { workspace = true }
axum = "0.8"
axum-extra = { version = "0.12", default-features = false, features = ["typed-header"] }
http = "1"
rmcp = { version = "3", default-features = false, features = ["server", "transport-streamable-http-server", "transport-io"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = { workspace = true }

[build-dependencies]
base64 = "0.23"
wasm-bindgen-cli-support = "=0.2.108"

[dev-dependencies]
base64 = "0.23"
http-body-util = "0.1"
sha2 = "0.11"
tempfile = { workspace = true }
url = "2"
