[package]
name = "noted-client"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["desktop"]
desktop = ["dep:noted-auth", "dep:keyring", "dep:open", "dep:tokio"]

[dependencies]
base64 = "0.23"
sha2 = "0.11"
url = "2"
noted-auth = { workspace = true, optional = true }
noted-core = { workspace = true }
keyring = { version = "4", optional = true }
open = { version = "5", optional = true }
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", optional = true, features = ["io-util", "net", "rt"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = "0.8"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
axum = "0.8"
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
