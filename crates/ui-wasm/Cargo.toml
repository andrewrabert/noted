[package]
name = "noted-ui-wasm"
authors = ["Andrew Rabert <ar@nullsum.net>"]
description = "The noted web UI, compiled to WebAssembly and served by noted-server."
edition = "2024"
license = "MIT"
homepage = "https://github.com/andrewrabert/noted"
repository = "https://github.com/andrewrabert/noted"
rust-version = "1.93"
publish = false

[lib]
name = "noted_ui_wasm"

[[bin]]
name = "noted-ui-wasm"
path = "src/main.rs"

[dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "cfeef0bb3a4a3dbf6615fd193539e454ccd06a6a", features = [
    "markdown",
    "highlighter",
    "advanced",
] }
noted-client = { path = "../client", default-features = false }
noted-core = { path = "../core" }
noted-picker = { path = "../picker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { git = "https://github.com/iced-rs/iced", rev = "cfeef0bb3a4a3dbf6615fd193539e454ccd06a6a", features = [
    "webgl",
    "fira-sans",
] }
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
log = "0.4"
url = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "History",
    "Location",
    "Navigator",
    "Storage",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
