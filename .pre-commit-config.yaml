repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-fmt-ui-wasm
        name: cargo fmt (ui-wasm)
        entry: cargo fmt --all --manifest-path crates/ui-wasm/Cargo.toml --check
        language: system
        files: ^crates/ui-wasm/
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy-ui-wasm
        name: cargo clippy (ui-wasm)
        entry: cargo clippy --manifest-path crates/ui-wasm/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
        language: system
        files: ^crates/ui-wasm/
        types: [rust]
        pass_filenames: false
