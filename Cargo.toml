[workspace]
members = ["crates/*"]
# `crates/*` would otherwise take this in: its `webgl`/`fira-sans` features are
# wasm-only and break every host `--workspace --all-targets` build.
exclude = ["crates/ui-wasm"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Andrew Rabert <ar@nullsum.net>"]
description = "A tree of Markdown notes and tasks."
edition = "2024"
license = "MIT"
homepage = "https://github.com/andrewrabert/noted"
repository = "https://github.com/andrewrabert/noted"
readme = "README.md"
rust-version = "1.90"

[workspace.dependencies]
noted-auth = { path = "crates/auth" }
noted-client = { path = "crates/client" }
noted-core = { path = "crates/core" }
noted-picker = { path = "crates/picker" }
noted-server = { path = "crates/server" }

chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
iso8601 = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = "0.1"

[profile.release]
lto = true
strip = true

[profile.test.package.scrypt]
opt-level = 2
